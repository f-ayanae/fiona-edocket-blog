<script>
/* ---------- Content lists: edit these as projects, posts and notes are finished ---------- */
/* A project gets a card on Home and its own page. */
const PROJECTS = [
  { slug: "third-party-model-review", name: "Third-Party AI/Model Review", cat: "Model risk · Third-party risk",
    line: "Can a bank adopt a credit bureau's new score before Germany's scoring rules change? A public-evidence review with a coded decision and a ready-to-run test kit.",
    result: "Not yet approvable, with a clear path to approval", date: "Nov 2026", cover: null,
    credit: "Photo: Michielverbeek, CC BY 4.0, Wikimedia Commons" }
];
/* Long-form writing. */
const POSTS = [
  { slug: "transparency-is-not-evidence", project: "third-party-model-review",
    title: "Transparency is not evidence: assessing a credit bureau score ahead of Germany's new scoring rules",
    line: "What a bank must show before adopting a vendor score, and how much of that the public record supports.",
    date: "13 Nov 2026", read: "13 min read" }
];
/* Short notes. The Notes menu item and sections appear once this list has an entry.
   Each: { date: "20 Nov 2026", title: "...", body: "<p>...</p>" } */
const NOTES = [];
/* Deliverables for the project page. Add a url when the repository is public; items without one show as plain text. */
const DELIVERABLES = [
  { name: "Full case study", kind: "Article", url: "#/post/transparency-is-not-evidence" },
  { name: "Decision memo", kind: "PDF · 1 page", url: null },
  { name: "Full review", kind: "PDF · 24 pages", url: null },
  { name: "Model-risk crosswalk", kind: "PDF · 1 page", url: null },
  { name: "Points-table calculator", kind: "Interactive", url: null },
  { name: "Code, tests and evidence register", kind: "Repository", url: null }
];

/* ---------- Rendering ---------- */
const $ = id => document.getElementById(id);
const photo = p => `<div class="photo"${p.cover ? ` style="--cover:url('${p.cover}')"` : ""}>${p.credit ? `<span class="credit">${p.credit}</span>` : ""}</div>`;
$("proj-list").innerHTML = PROJECTS.map((p, i) =>
  `<a class="post-card" href="#/projects/${p.slug}">
     <div class="reveal" style="--d:${0.1 + i * 0.05}s">${photo(p)}</div>
     <div>
       <span class="cat reveal">${p.cat}</span>
       <h2 class="reveal" style="--d:0.05s"><span>${p.name}</span></h2>
       <p class="reveal" style="--d:0.1s">${p.line}</p>
       <span class="result reveal" style="--d:0.14s">${p.result}</span>
       <span class="read reveal" style="--d:0.18s">View project <b>→</b></span>
     </div>
   </a>`).join("");
$("proj-count").textContent = `${PROJECTS.length} ${PROJECTS.length === 1 ? "project" : "projects"}`;
const row = (href, date, title, line, extra) =>
  `<li class="reveal"><a href="${href}"><time>${date}</time><span><b>${title}</b><em>${line}</em></span><i>${extra || ""} →</i></a></li>`;
$("post-list").innerHTML = POSTS.map(p => row(`#/post/${p.slug}`, p.date, p.title, p.line, p.read)).join("");
$("post-count").textContent = `${POSTS.length} ${POSTS.length === 1 ? "article" : "articles"}`;
const noteRows = list => list.map((n, i) => row(`#/notes/${i}`, n.date, n.title, "", "")).join("");
if (NOTES.length) {
  document.querySelector('#nav [data-v="notes"]').hidden = false;
  $("notes-home").hidden = false;
  $("note-list-home").innerHTML = noteRows(NOTES.slice(0, 3));
  $("note-list").innerHTML = noteRows(NOTES);
}
$("deliv").innerHTML = DELIVERABLES.map(d => d.url
  ? `<li><a href="${d.url}"${d.url.startsWith("#") ? "" : ' target="_blank" rel="noopener"'}><span>${d.name}</span><small>${d.kind}</small><b>→</b></a></li>`
  : `<li><span>${d.name}</span><small>${d.kind}</small></li>`).join("");

/* ---------- Motion: reveal on scroll, count-up figures ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); countUp(e.target); io.unobserve(e.target); } });
}, { rootMargin: "0px 0px -8% 0px", threshold: 0.12 }) : null;
function observe(root) {
  root.querySelectorAll(".reveal").forEach(el => {
    if (!io || reduce) { el.classList.add("in"); return; }
    el.classList.remove("in"); io.observe(el);
  });
}
function countUp(el) {
  if (reduce) return;
  el.querySelectorAll("[data-count]").forEach(n => {
    const to = +n.dataset.count, t0 = performance.now(), dur = 1100;
    const step = t => { const k = Math.min(1, (t - t0) / dur); n.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ---------- Router ----------
   #/  #/projects  #/writing  -> Home (scrolled to the section)
   #/projects/<slug>          -> project page
   #/post/<slug>              -> article
   #/about  #/notes           -> those pages */
const VIEWS = { home: $("home"), project: $("project"), post: $("post"), about: $("aboutv"), notes: $("notesv") };
let ready = false;
function route() {
  const h = location.hash || "#/";
  let v = "home", anchor = null, nav = null;
  if (h.startsWith("#/projects/")) { v = "project"; nav = "projects"; }
  else if (h.startsWith("#/post/")) { v = "post"; nav = "writing"; }
  else if (h === "#/about") { v = "about"; nav = "about"; }
  else if (h.startsWith("#/notes") && NOTES.length) { v = "notes"; nav = "notes"; }
  else if (h === "#/projects" || h === "#/writing") { anchor = h.slice(2); nav = anchor; }
  const apply = () => {
    for (const [k, el] of Object.entries(VIEWS)) el.hidden = k !== v;
    document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === nav));
    observe(VIEWS[v]);
    if (anchor) $(anchor).scrollIntoView({ behavior: reduce || !ready ? "auto" : "smooth" });
    else scrollTo(0, 0);
    onScroll();
  };
  if (ready && document.startViewTransition && !reduce) document.startViewTransition(apply); else apply();
  ready = true;
}
addEventListener("hashchange", route);

/* ---------- Masthead border and reading progress (articles only) ---------- */
const mast = $("mast"), bar = $("progress"), post = VIEWS.post;
function onScroll() {
  mast.classList.toggle("scrolled", scrollY > 8);
  if (!post.hidden) {
    const total = post.offsetHeight - innerHeight;
    bar.style.transform = `scaleX(${Math.max(0, Math.min(1, -post.getBoundingClientRect().top / Math.max(1, total)))})`;
  } else bar.style.transform = "scaleX(0)";
}
addEventListener("scroll", onScroll, { passive: true });
route();
</script>
